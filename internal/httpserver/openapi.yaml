openapi: 3.0.3
info:
  title: Task Service API
  description: REST API for team-based task management with roles, history and caching.
  version: "1.0"
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /register:
    post:
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /login:
    post:
      summary: Authenticate and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /teams:
    post:
      summary: Create a team (caller becomes owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                type: object
                properties:
                  team_id: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      summary: List teams the current user belongs to
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /teams/{id}/invite:
    post:
      summary: Invite (or change the role of) a user in a team. Owner/admin only.
      parameters:
        - $ref: '#/components/parameters/TeamIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, member], default: member }
      responses:
        '204': { description: Invited }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{team_id}/stats:
    get:
      summary: Team statistics report. Owner/admin only.
      parameters:
        - name: team_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamStats'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tasks:
    post:
      summary: Create a task in a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      summary: List tasks in a team, with filters and pagination
      parameters:
        - name: team_id
          in: query
          required: true
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [todo, in_progress, done] }
        - name: assignee_id
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tasks/{id}:
    put:
      summary: Update a task (optimistic concurrency via version)
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Version mismatch - task was modified concurrently
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tasks/{id}/history:
    get:
      summary: Task change history
      description: >
        404 covers both "no such task" and "task exists but you're not on
        its team" - the two are indistinguishable by design, so a caller
        can't enumerate task IDs belonging to other teams.
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskHistoryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}/comments:
    post:
      summary: Add a comment to a task
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List comments on a task
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TeamIdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    TaskIdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed to perform this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    Team:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        created_by: { type: integer }
        created_at: { type: string, format: date-time }
        role: { type: string, enum: [owner, admin, member] }

    CreateTaskRequest:
      type: object
      required: [team_id, title]
      properties:
        team_id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        assignee_id: { type: integer, nullable: true }

    UpdateTaskRequest:
      type: object
      required: [version]
      description: >
        Only include the fields you want to change. `version` must match
        the task's current version (as returned by the last GET/PUT) or
        the request fails with 409.
      properties:
        version: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [todo, in_progress, done] }
        assignee_id: { type: integer, nullable: true }

    Task:
      type: object
      properties:
        id: { type: integer }
        team_id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [todo, in_progress, done] }
        created_by: { type: integer }
        assignee_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        version: { type: integer }

    TaskHistoryEntry:
      type: object
      properties:
        id: { type: integer }
        task_id: { type: integer }
        changed_by: { type: integer }
        changes:
          type: object
          description: Map of field name to {old, new} values.
        created_at: { type: string, format: date-time }

    Comment:
      type: object
      properties:
        id: { type: integer }
        task_id: { type: integer }
        user_id: { type: integer }
        content: { type: string }
        created_at: { type: string, format: date-time }

    TeamStats:
      type: object
      properties:
        team_id: { type: integer }
        tasks_by_status:
          type: object
          additionalProperties: { type: integer }
        top_assignees:
          type: array
          items:
            type: object
            properties:
              user_id: { type: integer }
              name: { type: string }
              closed_count: { type: integer }
        avg_close_hours: { type: number, nullable: true }
        total_comments: { type: integer }
